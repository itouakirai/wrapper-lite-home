<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · wrapper-lite</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-brand">
      <svg class="brand-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="6" y="6" width="36" height="36" rx="10" fill="#4f7cff" fill-opacity="0.15"/>
        <path d="M16 24l6 6 10-12" stroke="#4f7cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>wrapper-lite</h1>
      <p>API 聚合管理后台</p>
    </div>
    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="username">用户名</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div id="login-error" class="form-error" hidden></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">登 录</button>
    </form>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
