<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wrapper-lite · 控制台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="6" y="6" width="36" height="36" rx="10" fill="#4f7cff" fill-opacity="0.15"/>
        <path d="M16 24l6 6 10-12" stroke="#4f7cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="brand-title">wrapper-lite</div>
        <div class="brand-sub">API 聚合网关</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="last-update" id="last-update"></span>
      <button class="btn btn-ghost" id="logout-btn">退出登录</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="stats-row">
    <div class="stat-card">
      <div class="stat-label">总处理数</div>
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-sub">累计请求</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">今日处理数</div>
      <div class="stat-value accent" id="stat-today">0</div>
      <div class="stat-sub" id="stat-today-sub">0 次 / 最近 1 小时</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">在线上游</div>
      <div class="stat-value" id="stat-online">0</div>
      <div class="stat-sub" id="stat-online-sub">共 0 个上游</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">合并区域</div>
      <div class="stat-value" id="stat-regions">0</div>
      <div class="stat-sub" id="stat-regions-list">-</div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">上游状态</h2>
    <div class="uptime-grid" id="uptime-grid"></div>
  </section>

  <section class="section">
    <h2 class="section-title">今日请求（按小时）</h2>
    <div class="card chart-card">
      <div class="chart" id="hourly-chart"></div>
      <div class="chart-legend" id="hourly-legend"></div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">近 7 日请求</h2>
    <div class="card chart-card">
      <div class="chart" id="daily-chart"></div>
      <div class="chart-legend" id="daily-legend"></div>
    </div>
  </section>

  <section class="section two-col">
    <div>
      <h2 class="section-title">各 API 处理数</h2>
      <div class="card">
        <div class="table" id="upstream-table"></div>
      </div>
    </div>
    <div>
      <h2 class="section-title">各端点处理数</h2>
      <div class="card">
        <div class="table" id="endpoint-table"></div>
      </div>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
