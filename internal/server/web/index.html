<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wrapper-lite · 控制台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="6" y="6" width="36" height="36" rx="10" fill="#4f7cff" fill-opacity="0.15"/>
        <path d="M16 24l6 6 10-12" stroke="#4f7cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="brand-title">wrapper-lite</div>
        <div class="brand-sub">API 聚合网关</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="last-update" id="last-update"></span>
      <button class="btn btn-ghost" id="logout-btn">退出登录</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="stats-row">
    <div class="stat-card">
      <div class="stat-label">总处理数</div>
      <div class="stat-value" id="stat-total">0</div>
      <div class="stat-sub">累计请求</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">今日处理数</div>
      <div class="stat-value accent" id="stat-today">0</div>
      <div class="stat-sub" id="stat-today-sub">0 次 / 最近 1 小时</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">在线上游</div>
      <div class="stat-value" id="stat-online">0</div>
      <div class="stat-sub" id="stat-online-sub">共 0 个上游</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">合并区域</div>
      <div class="stat-value" id="stat-regions">0</div>
      <div class="stat-sub" id="stat-regions-list">-</div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">上游管理</h2>
    <div class="card upstream-admin">
      <form class="upstream-form" id="upstream-form">
        <label>
          <span>名称</span>
          <input id="upstream-name" type="text" placeholder="例如：JP API" autocomplete="off" required>
        </label>
        <label>
          <span>Base URL</span>
          <input id="upstream-url" type="url" placeholder="http://127.0.0.1:3003" autocomplete="off" required>
        </label>
        <label class="checkbox-label">
          <input id="upstream-enabled" type="checkbox" checked>
          <span>启用</span>
        </label>
        <button class="btn btn-primary" type="submit">添加上游</button>
      </form>
      <div class="form-message" id="upstream-message" hidden></div>
      <div class="upstream-list" id="upstream-list"></div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">上游状态</h2>
    <div class="uptime-grid" id="uptime-grid"></div>
  </section>

  <section class="section">
    <h2 class="section-title">今日请求（按小时）</h2>
    <div class="card chart-card">
      <div class="chart" id="hourly-chart"></div>
      <div class="chart-legend" id="hourly-legend"></div>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">近 7 日请求</h2>
    <div class="card chart-card">
      <div class="chart" id="daily-chart"></div>
      <div class="chart-legend" id="daily-legend"></div>
    </div>
  </section>

  <section class="section two-col">
    <div>
      <h2 class="section-title">各 API 处理数</h2>
      <div class="card">
        <div class="table" id="upstream-table"></div>
      </div>
    </div>
    <div>
      <h2 class="section-title">各端点处理数</h2>
      <div class="card">
        <div class="table" id="endpoint-table"></div>
      </div>
    </div>
  </section>

  <section class="section two-col">
    <div>
      <h2 class="section-title">今日客户端 IP 排行</h2>
      <div class="card">
        <div class="table" id="ip-today-table"></div>
      </div>
    </div>
    <div>
      <h2 class="section-title">累计客户端 IP 排行</h2>
      <div class="card">
        <div class="table" id="ip-total-table"></div>
        <div class="chart-legend" id="ip-tracked-legend"></div>
      </div>
    </div>
  </section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
